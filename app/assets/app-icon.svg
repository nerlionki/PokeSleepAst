<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="睡觉的小卡比兽">
  <defs>
    <radialGradient id="sky" cx="50%" cy="43%" r="70%">
      <stop offset="0" stop-color="#ecf8f5"/>
      <stop offset="1" stop-color="#badde0"/>
    </radialGradient>
    <linearGradient id="blue" x1=".17" y1=".1" x2=".85" y2="1">
      <stop offset="0" stop-color="#4c7887"/>
      <stop offset="1" stop-color="#244e62"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <ellipse cx="516" cy="752" rx="282" ry="68" fill="#477c85" opacity=".18" filter="url(#shadow)"/>
  <g stroke="#173c4b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- The sleeping body curls behind the face. -->
    <path d="M324 570c-27 81 16 170 107 199 120 38 273-6 315-95 45-93-23-190-154-210-115-18-229 26-268 106Z" fill="url(#blue)"/>
    <path d="M508 563c31-23 93-25 136 8 32 25 45 69 21 104-32 45-113 63-169 39-54-23-69-105 12-151Z" fill="#e9dfb7"/>
    <!-- Tiny hind foot and three clear toes. -->
    <path d="M665 677c36 4 67 24 81 55 9 19-4 40-26 42-32 4-89-12-117-33-18-14-21-33-8-47 16-17 39-21 70-17Z" fill="#365f70"/>
    <path d="M666 723l-7 27M698 727l-3 30" fill="none" stroke-width="15"/>
    <!-- Pointed ears are characteristic of Munchlax. -->
    <path d="M313 365c-13-49-20-103-13-150 41 12 87 47 113 84Z" fill="#315f72"/>
    <path d="M587 302c34-49 83-76 131-84-4 55-19 109-42 149Z" fill="#315f72"/>
    <path d="M330 259c16 7 34 19 48 34M671 292c16-14 31-24 45-30" fill="none" stroke="#7197a0" stroke-width="10"/>
    <!-- Large head and cream face mask. -->
    <path d="M264 416c10-95 114-158 231-156 127 2 229 70 236 171 10 134-85 235-235 247-141 11-244-78-232-262Z" fill="url(#blue)"/>
    <path d="M328 399c18-55 81-83 140-55 21 10 38 26 47 44 20-26 55-43 91-41 48 2 91 28 104 72 20 68-22 157-88 197-56 34-151 44-218 12-72-34-108-150-76-229Z" fill="#f1e8c7"/>
    <!-- Sleepy closed eyes and tiny smile. -->
    <path d="M367 459c22 23 55 28 81 8M550 467c26 20 59 16 81-8" fill="none" stroke-width="16"/>
    <path d="M477 531c20 14 48 14 69 0" fill="none" stroke-width="12"/>
    <path d="M475 536l-7 23M548 536l6 23" fill="none" stroke-width="11"/>
    <!-- Tucked front paws finish the curled pose. -->
    <path d="M321 590c-7 35 9 66 40 80 24 11 57 0 71-25 10-18 6-42-9-53-28-20-65-23-102-2Z" fill="#3e6a79"/>
    <path d="M588 608c20-15 49-17 67-2 19 16 17 43-4 57-25 17-58 23-85 13-22-9-29-31-15-49 10-12 20-12 37-19Z" fill="#3e6a79"/>
  </g>
</svg>
