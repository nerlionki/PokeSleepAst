name: iOS unsigned device build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*', '*_hotfix']
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/ios-unsigned.yml'
      - '.github/scripts/publish-release.sh'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Resolve application version
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import { buildVersionCode, iosMarketingVersion, versionFromTag } from "./src/update/version.ts";
            const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
            const tag = process.env.GITHUB_REF_NAME;
            const version = process.env.GITHUB_REF_TYPE === "tag" ? versionFromTag(tag) : packageVersion;
            if (!version || version !== packageVersion) throw new Error("Release tag and package version must match");
            appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${version}\nIOS_MARKETING_VERSION=${iosMarketingVersion(version)}\nAPP_VERSION_CODE=${buildVersionCode(version)}\n`);
          '
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Generate and sync iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          npm run icons:ios
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName 宝睡小助手' ios/App/App/Info.plist
      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/pokesleep-ios-build" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          app_path="$RUNNER_TEMP/pokesleep-ios-build/Build/Products/Release-iphoneos/App.app"
          test -d "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")" = "$IOS_MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")" = "$APP_VERSION_CODE"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist"
          mkdir -p release/ios-unsigned/Payload
          ditto "$app_path" release/ios-unsigned/Payload/App.app
          (cd release/ios-unsigned && zip -qry "../PokeSleepAst-$APP_VERSION-unsigned.ipa" Payload)
          unzip -tq "release/PokeSleepAst-$APP_VERSION-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.APP_VERSION }}-unsigned
          path: app/release/PokeSleepAst-${{ env.APP_VERSION }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Publish complete release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: bash ../.github/scripts/publish-release.sh "$RELEASE_TAG" "release/PokeSleepAst-$APP_VERSION-unsigned.ipa"
