name: Apply reviewed release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag containing reviewed notes
        required: true
        default: v1.0.7
  push:
    branches: [main]
    paths: ['.github/workflows/release-notes.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply notes from the reviewed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v1.0.7' }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.txt"
          test -s "$RUNNER_TEMP/release-notes.txt"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.txt"
